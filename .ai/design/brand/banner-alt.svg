<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1f24"/>
      <stop offset="1" stop-color="#10373b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12a594"/>
      <stop offset="1" stop-color="#2cc0b8"/>
    </linearGradient>
  </defs>
  <rect width="1544" height="500" fill="url(#bg)"/>

  <!-- rings behind the shield -->
  <g fill="none" stroke="#2cc0b8">
    <circle cx="1190" cy="250" r="150" stroke-opacity=".28" stroke-width="2"/>
    <circle cx="1190" cy="250" r="225" stroke-opacity=".16" stroke-width="2"/>
    <circle cx="1190" cy="250" r="305" stroke-opacity=".09" stroke-width="2"/>
    <circle cx="1190" cy="250" r="390" stroke-opacity=".05" stroke-width="2"/>
  </g>

  <!-- shield -->
  <g transform="translate(1190 250)">
    <path d="M0 -118l98 35v76c0 64-42 106-98 122-56-16-98-58-98-122v-76z" fill="url(#teal)"/>
    <path d="M-40 4l28 28 54-58" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- small status dots on the rings -->
  <g fill="#2cc0b8">
    <circle cx="1040" cy="250" r="7"/>
    <circle cx="1349" cy="91" r="7" fill-opacity=".8"/>
    <circle cx="1296" cy="449" r="6" fill-opacity=".6"/>
    <circle cx="975" cy="130" r="5" fill-opacity=".5"/>
  </g>

  <text x="96" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2cc0b8" letter-spacing="3">NHR SECURE</text>
  <text x="96" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">Security for WordPress,</text>
  <text x="96" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">without the noise</text>

  <!-- feature chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#e3eeee">
    <g transform="translate(96 356)">
      <rect width="196" height="50" rx="25" fill="#ffffff" fill-opacity=".08" stroke="#2cc0b8" stroke-opacity=".45"/>
      <text x="98" y="33" text-anchor="middle">Login protection</text>
    </g>
    <g transform="translate(306 356)">
      <rect width="150" height="50" rx="25" fill="#ffffff" fill-opacity=".08" stroke="#2cc0b8" stroke-opacity=".45"/>
      <text x="75" y="33" text-anchor="middle">Two-factor</text>
    </g>
    <g transform="translate(470 356)">
      <rect width="116" height="50" rx="25" fill="#ffffff" fill-opacity=".08" stroke="#2cc0b8" stroke-opacity=".45"/>
      <text x="58" y="33" text-anchor="middle">Firewall</text>
    </g>
    <g transform="translate(600 356)">
      <rect width="116" height="50" rx="25" fill="#ffffff" fill-opacity=".08" stroke="#2cc0b8" stroke-opacity=".45"/>
      <text x="58" y="33" text-anchor="middle">Scanner</text>
    </g>
    <g transform="translate(730 356)">
      <rect width="150" height="50" rx="25" fill="#ffffff" fill-opacity=".08" stroke="#2cc0b8" stroke-opacity=".45"/>
      <text x="75" y="33" text-anchor="middle">Activity log</text>
    </g>
  </g>
</svg>
